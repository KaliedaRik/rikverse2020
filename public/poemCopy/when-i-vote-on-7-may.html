<p class="epigraph">(After the first global financial crisis of the 21st century)</p>

<div aria-label="Poem body" data-form="Double dactyl">
	<p>Tyrocrat pyrocrat<br />
	Watergate felons who<br />
	went to the wall for a<br />
	criminal deed.</p>

	<p>Still I see bankers who<br />
	roam through the City, their<br />
	nonconsequentialness<br />
	noted, indeed.</p>
</div>
