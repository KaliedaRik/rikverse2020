<p aria-label="Epigraph" class="epigraph">(After <a href="https://www.onassis.org/el/initiatives/cavafy-archive/the-canon/i-went">Επήγα</a> by Κωνσταντίνος Καβάφης)</p>

<div aria-label="Poem body">
    <p>I do not stall. I loosen completely and go.<br />
    Into indulgencies, perhaps half real,<br />
    half-caught in my head, and still &ndash;<br />
    I move into the well-lit night.<br />
    And I drink the strong wines as folk<br />
    brave in their pleasures do drink.</p>
</div>
