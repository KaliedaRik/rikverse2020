<div aria-label="Poem body">
    <p>The best graves I stood before sit in Havana.<br />
    Lalique pours radiance amid shroud-capped pillars.</p>

    <p>Mausoleums irk me: pyramids on the horizon strike<br />
    better at sunset as I stood amid Cairo minarets.</p>

    <p>I want graven letters to mark you; I lack<br />
    the vision to chisel you amid unquarried spires.</p>
</div>
